<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Tasks</title>
<meta name="theme-color" content="#14161c" />
<meta name="description" content="A simple, personal task list with day tracking." />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tasks" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14161c;
    --panel: #1c1f28;
    --border: #242731;
    --border-strong: #2a2e3a;
    --text: #e8e9ed;
    --text-dim: #6b6f7d;
    --text-faint: #4a4d59;
    --accent: #5b8dee;
    --accent-strong: #6d9bf0;
    --high: #e2574c;
    --medium: #d9a441;
    --low: #4f9d69;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  ::selection { background: #5b8dee55; }
  #root {
    max-width: 560px;
    margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 16px 40px;
    width: 100%;
    zoom: 1.14;
  }
  .header { margin-bottom: 24px; }
  .header-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px; flex-wrap: wrap; gap: 8px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: clamp(22px, 6vw, 28px); letter-spacing: -0.02em;
    margin: 0; color: #f4f5f7;
  }
  .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .stats { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .points-badge {
    display: flex; align-items: center; gap: 5px;
    background: linear-gradient(135deg, #d9a44122, #5b8dee22);
    border: 1px solid var(--border-strong); border-radius: 20px;
    padding: 4px 10px; font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 500; color: #f0c869; white-space: nowrap;
  }
  .divider { height: 1px; background: var(--border); }
  .rank-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .rank-badge {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px;
  }
  .rank-badge .rank-icon { font-size: 18px; }
  .rank-progress-wrap { flex: 1; min-width: 0; }
  .rank-progress-track {
    height: 6px; background: var(--border); border-radius: 4px; overflow: hidden;
  }
  .rank-progress-fill {
    height: 100%; border-radius: 4px; transition: width .4s ease;
    background: linear-gradient(90deg, #5b8dee, #f0c869);
  }
  .rank-progress-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-faint);
    margin-top: 3px;
  }
  .rank-badge {
    display: flex; align-items: center; gap: 4px;
    background: var(--panel); border: 1px solid var(--border-strong); border-radius: 20px;
    padding: 4px 10px; font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 500; white-space: nowrap;
  }
  .rank-progress-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .rank-progress-bar {
    flex: 1; height: 6px; background: var(--panel); border-radius: 4px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .rank-progress-fill {
    height: 100%; border-radius: 4px; transition: width .4s ease;
    background: linear-gradient(90deg, #5b8dee, #f0c869);
  }
  .rank-progress-text {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-faint);
    white-space: nowrap; flex-shrink: 0;
  }
  .start-row {
    display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap;
  }
  .start-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-faint);
  }
  .start-date-text {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); font-weight: 500;
  }
  #startDateInput {
    display: none; background: var(--panel); border: 1px solid var(--border-strong);
    border-radius: 6px; color: var(--text); font-size: 11px; font-family: 'IBM Plex Mono', monospace;
    padding: 3px 6px; color-scheme: dark;
  }
  #startDateInput.show { display: inline-block; }
  .start-edit-btn {
    background: transparent; border: none; color: var(--accent-strong);
    font-size: 11px; font-family: 'IBM Plex Mono', monospace; cursor: pointer;
    padding: 2px 4px; text-decoration: underline;
  }

  .add-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .add-field {
    flex: 1; min-width: 0; display: flex; align-items: center;
    background: var(--panel); border: 1px solid var(--border-strong);
    border-radius: 10px; padding: 0 4px 0 14px;
  }
  #taskInput {
    flex: 1; min-width: 0; background: transparent; border: none; color: var(--text);
    font-size: 16px; padding: 13px 0; font-family: 'Inter', sans-serif;
  }
  #taskInput:focus { outline: none; }
  #taskInput::placeholder { color: var(--text-faint); }

  .prio-btn {
    display: flex; align-items: center; gap: 5px; border: none; border-radius: 7px;
    padding: 8px 9px; cursor: pointer; font-size: 12px; font-family: 'IBM Plex Mono', monospace;
    font-weight: 500; position: relative; flex-shrink: 0;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .prio-menu {
    position: absolute; top: 110%; right: 0; background: var(--panel);
    border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden;
    z-index: 20; min-width: 110px; display: none;
  }
  .prio-menu.open { display: block; }
  .prio-item { display: flex; align-items: center; gap: 7px; padding: 10px 12px;
    font-size: 12px; font-family: 'IBM Plex Mono', monospace; color: #c9cbd4; cursor: pointer; }
  .prio-item:hover { background: var(--border); }

  .add-btn {
    background: var(--accent); border: none; border-radius: 10px; width: 46px; min-width: 46px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .add-btn:hover { background: var(--accent-strong); }
  .add-btn:active { transform: scale(.97); }

  .date-row { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; }
  .date-field {
    display: flex; align-items: center; gap: 7px;
    background: var(--panel); border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 7px 10px; flex: 1; min-width: 130px;
  }
  .date-field label {
    font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--text-dim); flex-shrink: 0;
  }
  #taskDate {
    background: transparent; border: none; color: var(--text);
    font-size: 12px; font-family: 'IBM Plex Mono', monospace; padding: 2px 0;
    color-scheme: dark; max-width: 130px;
  }
  #taskDate:focus { outline: none; }
  #taskSubject {
    background: transparent; border: none; color: var(--text);
    font-size: 12px; font-family: 'IBM Plex Mono', monospace; padding: 2px 0;
    flex: 1; min-width: 0;
  }
  #taskSubject:focus { outline: none; }

  .bulk-toggle {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent-strong);
    margin-bottom: 16px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }
  .bulk-panel {
    background: var(--panel); border: 1px solid var(--border-strong); border-radius: 10px;
    padding: 14px; margin-bottom: 18px; display: flex; flex-direction: column; gap: 12px;
  }
  .subject-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: var(--accent-strong);
    text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 6px; padding-left: 2px;
  }
  .subject-label:first-child { margin-top: 0; }

  .filters { display: flex; gap: 4px; margin-bottom: 18px; }
  .filter-btn {
    background: transparent; border: none; border-radius: 7px; padding: 7px 12px;
    font-size: 13px; font-family: 'Inter', sans-serif; font-weight: 500;
    color: var(--text-dim); cursor: pointer;
  }
  .filter-btn.active { background: var(--border); color: var(--text); }

  .day-group { margin-bottom: 16px; }
  .day-head {
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    padding: 10px 12px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 9px; margin-bottom: 8px; user-select: none;
  }
  .day-head.complete { border-color: #4f9d6955; background: #4f9d6912; }
  .day-badge-lg {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px;
    color: var(--accent-strong); background: #5b8dee1a; border-radius: 6px;
    padding: 3px 8px; flex-shrink: 0;
  }
  .day-head.complete .day-badge-lg { color: #4f9d69; background: #4f9d6922; }
  .day-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .day-date { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-faint); }
  .day-progress { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); }
  .chevron { transition: transform .2s; flex-shrink: 0; color: var(--text-faint); }
  .day-group.collapsed .chevron { transform: rotate(-90deg); }
  .day-group.collapsed .task-list { display: none; }

  .task-list { display: flex; flex-direction: column; gap: 6px; }
  .task-row {
    display: flex; align-items: center; gap: 10px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 9px; padding: 12px;
  }
  .task-row.completed { opacity: .55; }
  .check-btn { background: transparent; border: none; cursor: pointer; padding: 4px; display: flex; flex-shrink: 0; margin: -4px; }
  .task-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .task-text { font-size: 14px; font-family: 'Inter', sans-serif; word-break: break-word; }
  .task-text.done { color: var(--text-dim); text-decoration: line-through; }
  .task-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .points-pill {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-faint);
  }
  .del-btn { background: transparent; border: none; cursor: pointer; opacity: .55; transition: opacity .15s; display: flex; padding: 6px; flex-shrink: 0; margin: -6px; }
  @media (hover: hover) {
    .del-btn { opacity: 0; }
    .task-row:hover .del-btn { opacity: 1; }
  }
  .empty-state, .loading-state {
    text-align: center; padding: 48px 0; color: var(--text-faint);
    font-size: 13px; font-family: 'IBM Plex Mono', monospace;
  }
  .footer-note {
    margin-top: 28px; font-size: 11px; color: var(--text-faint);
    font-family: 'IBM Plex Mono', monospace; text-align: center;
  }
  .install-banner {
    display: none; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--panel); border: 1px solid var(--border-strong); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 20px; font-size: 13px; flex-wrap: wrap;
  }
  .install-banner.show { display: flex; }
  .install-banner button {
    background: var(--accent); border: none; border-radius: 7px; padding: 8px 12px;
    color: #0f1015; font-weight: 600; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  svg { display: block; }

  .point-pop {
    position: fixed; left: 50%; top: 18%; transform: translate(-50%, 0);
    pointer-events: none; z-index: 100;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px;
    color: #f0c869; text-shadow: 0 2px 12px #d9a44166;
    animation: pointPop 0.9s ease-out forwards;
  }
  @keyframes pointPop {
    0%   { opacity: 0; transform: translate(-50%, 12px) scale(.8); }
    20%  { opacity: 1; transform: translate(-50%, -6px) scale(1.08); }
    70%  { opacity: 1; transform: translate(-50%, -18px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -34px) scale(1); }
  }
  .day-pop {
    position: fixed; left: 50%; top: 30%; transform: translate(-50%, 0);
    pointer-events: none; z-index: 100; text-align: center;
    animation: dayPop 1.4s ease-out forwards;
  }
  .day-pop .big { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; color: #4f9d69; text-shadow: 0 2px 14px #4f9d6988; }
  .day-pop .small { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9fd6b0; margin-top: 2px; }
  @keyframes dayPop {
    0%   { opacity: 0; transform: translate(-50%, 16px) scale(.85); }
    15%  { opacity: 1; transform: translate(-50%, -4px) scale(1.05); }
    80%  { opacity: 1; transform: translate(-50%, -8px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -24px) scale(1); }
  }
  .points-badge.bump { animation: badgeBump .4s ease; }
  @keyframes badgeBump { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }

  .confetti-piece {
    position: fixed; top: -12px; width: 8px; height: 14px; opacity: .95;
    z-index: 99; border-radius: 2px; pointer-events: none;
    animation: confettiFall 1.7s ease-in forwards;
  }
  @keyframes confettiFall {
    to { transform: translateY(105vh) rotate(420deg); opacity: 0; }
  }
  .gift-pop {
    position: fixed; left: 50%; top: 28%; transform: translate(-50%, 0);
    pointer-events: none; z-index: 101; text-align: center;
    animation: giftPop 1.8s ease-out forwards;
  }
  .rankup-pop {
    position: fixed; left: 50%; top: 26%; transform: translate(-50%, 0);
    pointer-events: none; z-index: 102; text-align: center;
    animation: giftPop 2s ease-out forwards;
  }
  .rankup-pop .rankup-icon { font-size: 48px; animation: giftShake 0.6s ease; }
  .rankup-pop .rankup-title { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); margin-top: 4px; letter-spacing: .05em; text-transform: uppercase; }
  .rankup-pop .rankup-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 24px; color: #f0c869; text-shadow: 0 2px 14px #d9a44188; margin-top: 2px; }
  .gift-pop .gift-icon { font-size: 44px; animation: giftShake 0.6s ease; }
  .gift-pop .gift-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; color: #4f9d69; text-shadow: 0 2px 14px #4f9d6988; margin-top: 4px; }
  .gift-pop .gift-reward { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #f0c869; margin-top: 4px; }
  @keyframes giftShake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-8deg); }
    75% { transform: rotate(8deg); }
  }
  @keyframes giftPop {
    0%   { opacity: 0; transform: translate(-50%, 20px) scale(.8); }
    15%  { opacity: 1; transform: translate(-50%, -4px) scale(1.08); }
    85%  { opacity: 1; transform: translate(-50%, -8px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -26px) scale(1); }
  }
  .rankup-pop {
    position: fixed; left: 50%; top: 24%; transform: translate(-50%, 0);
    pointer-events: none; z-index: 102; text-align: center;
    animation: giftPop 2s ease-out forwards;
  }
  .rankup-pop .rankup-icon { font-size: 48px; animation: giftShake 0.6s ease; }
  .rankup-pop .rankup-title { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); letter-spacing: .05em; text-transform: uppercase; margin-top: 6px; }
  .rankup-pop .rankup-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 24px; margin-top: 2px; text-shadow: 0 2px 14px currentColor; }

  @media (max-width: 380px) {
    #root { padding-left: 12px; padding-right: 12px; }
    .task-meta { gap: 5px; }
    h1 { font-size: 22px; }
  }

  /* Bottom navigation */
  body { padding-bottom: 74px; }
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    display: flex; background: #181a22; border-top: 1px solid var(--border-strong);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: transparent; border: none; padding: 10px 0 8px; cursor: pointer;
    color: var(--text-faint); font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500;
  }
  .nav-btn.active { color: var(--accent-strong); }

  /* Tools grid */
  .tools-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .tool-card {
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
    background: var(--panel); border: 1px solid var(--border-strong); border-radius: 12px;
    padding: 16px 14px; cursor: pointer; text-align: left;
  }
  .tool-card .tool-icon { font-size: 26px; }
  .tool-card .tool-name { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; color: var(--text); }

  /* Tool detail view */
  .tool-detail-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
  }
  .tool-back-btn {
    background: var(--panel); border: 1px solid var(--border-strong); border-radius: 8px;
    width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; color: var(--text);
  }
  .tool-detail-header h2 {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; color: #f4f5f7; margin: 0;
  }
  .tool-body { display: flex; flex-direction: column; gap: 14px; }
  .tool-field label {
    display: block; font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--text-dim); margin-bottom: 6px;
  }
  .tool-input, .tool-select {
    width: 100%; background: var(--panel); border: 1px solid var(--border-strong);
    border-radius: 9px; padding: 12px 14px; color: var(--text); font-size: 15px;
    font-family: 'Inter', sans-serif;
  }
  .tool-input:focus, .tool-select:focus { outline: none; border-color: var(--accent); }
  .tool-row { display: flex; gap: 10px; }
  .tool-row .tool-field { flex: 1; min-width: 0; }
  .tool-btn-primary {
    background: var(--accent); border: none; border-radius: 9px; padding: 13px;
    color: #0f1015; font-weight: 600; font-size: 14px; cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .tool-btn-primary:active { transform: scale(.98); }
  .tool-result {
    background: var(--panel); border: 1px solid var(--border-strong); border-radius: 10px;
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .tool-result-row { display: flex; justify-content: space-between; align-items: baseline; }
  .tool-result-label { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); }
  .tool-result-value { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; color: #f4f5f7; }
  .tool-result-value.accent { color: var(--accent-strong); }
  .tool-result-big { text-align: center; padding: 6px 0; }
  .tool-result-big .val { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px; color: #f0c869; }
  .tool-result-big .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .tool-checks { display: flex; flex-wrap: wrap; gap: 10px; }
  .tool-check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-dim); font-family: 'Inter', sans-serif; }
  .tool-note { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-faint); text-align: center; }
  .tool-file-drop {
    border: 1.5px dashed var(--border-strong); border-radius: 10px; padding: 24px 14px;
    text-align: center; color: var(--text-dim); font-size: 13px; cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .pdf-file-list { display: flex; flex-direction: column; gap: 6px; }
  .pdf-file-item {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
    font-size: 12px; font-family: 'IBM Plex Mono', monospace; color: var(--text-dim);
  }

  /* Calculator */
  .calc-display {
    background: var(--panel); border: 1px solid var(--border-strong); border-radius: 10px;
    padding: 20px 16px; text-align: right; font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 32px; color: #f4f5f7; word-break: break-all; min-height: 44px;
  }
  .calc-display .calc-expr { font-size: 13px; color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; min-height: 16px; }
  .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .calc-btn {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 0; font-size: 18px; font-family: 'Inter', sans-serif; font-weight: 500;
    color: var(--text); cursor: pointer;
  }
  .calc-btn:active { background: var(--border); }
  .calc-btn.op { color: var(--accent-strong); }
  .calc-btn.eq { background: var(--accent); color: #0f1015; font-weight: 700; }
  .calc-btn.clear { color: var(--high); }

  /* Expense tracker */
  .exp-summary { display: flex; gap: 10px; }
  .exp-summary-card {
    flex: 1; background: var(--panel); border: 1px solid var(--border-strong); border-radius: 10px;
    padding: 12px; text-align: center;
  }
  .exp-summary-card .exp-val { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; color: #f0c869; }
  .exp-summary-card .exp-lbl { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-faint); margin-top: 2px; }
  .exp-list { display: flex; flex-direction: column; gap: 6px; }
  .exp-day-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-faint); margin: 6px 0 2px; }
  .exp-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px;
  }
  .exp-item .exp-cat { font-size: 13px; font-weight: 500; color: var(--text); }
  .exp-item .exp-note { font-size: 11px; color: var(--text-faint); margin-top: 1px; }
  .exp-item .exp-amt { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--high); flex-shrink: 0; }
  .exp-del { background: transparent; border: none; color: var(--text-faint); cursor: pointer; padding: 4px; flex-shrink: 0; }

  /* Digital Wellbeing */
  .wb-progress-track { height: 10px; background: var(--border); border-radius: 6px; overflow: hidden; }
  .wb-progress-fill { height: 100%; border-radius: 6px; transition: width .4s ease; }
  .wb-history-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .wb-history-day { width: 34px; flex-shrink: 0; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-faint); }
  .wb-history-track { flex: 1; height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .wb-history-fill { height: 100%; border-radius: 5px; }
  .wb-history-val { width: 42px; text-align: right; flex-shrink: 0; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); }
  .wb-timer-display { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 40px; color: #f4f5f7; text-align: center; }

  /* Leaderboard */
  .lb-item {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 9px;
    padding: 10px 12px; margin-bottom: 6px;
  }
  .lb-item.you { border-color: var(--accent); background: #5b8dee14; }
  .lb-rank-num { width: 24px; text-align: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; color: var(--text-dim); flex-shrink: 0; }
  .lb-info { flex: 1; min-width: 0; }
  .lb-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .lb-name .you-tag { font-size: 10px; color: var(--accent-strong); font-family: 'IBM Plex Mono', monospace; margin-left: 5px; }
  .lb-rank-label { font-size: 11px; color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; }
  .lb-points { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; color: #f0c869; flex-shrink: 0; }
</style>
</head>
<body>
<div id="root">

<script>
const RANKS = [
  { name: "Beginner", icon: "🌱", min: 0 },
  { name: "Bronze", icon: "🥉", min: 50 },
  { name: "Silver", icon: "🥈", min: 150 },
  { name: "Gold", icon: "🥇", min: 300 },
  { name: "Platinum", icon: "💎", min: 500 },
  { name: "Master", icon: "👑", min: 800 },
  { name: "Legend", icon: "🏆", min: 1200 },
];
function getRankInfo(points) {
  let current = RANKS[0], next = RANKS[1] || null;
  for (let i = 0; i < RANKS.length; i++) {
    if (points >= RANKS[i].min) { current = RANKS[i]; next = RANKS[i + 1] || null; }
  }
  return { current, next };
}
let lastKnownRank = null;

const PRIORITY = {
  high: { label: "High", color: "#e2574c", points: 15 },
  medium: { label: "Medium", color: "#d9a441", points: 10 },
  low: { label: "Low", color: "#4f9d69", points: 5 },
};
const STORAGE_KEY = "todo-app-tasks-v2";
const START_KEY = "todo-app-start-date";
const COLLAPSE_KEY = "todo-app-collapsed-days";
const SUBJECTS_KEY = "todo-app-subjects";
const NEW_SUBJECT_VALUE = "__new__";
let tasks = [];
let filter = "All";
let currentPriority = "medium";
let collapsed = {};

function loadSubjects() {
  try {
    const raw = localStorage.getItem(SUBJECTS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  const defaults = ["Math", "Science", "Reasoning", "English", "Skill"];
  localStorage.setItem(SUBJECTS_KEY, JSON.stringify(defaults));
  return defaults;
}
function saveSubjects(list) {
  try { localStorage.setItem(SUBJECTS_KEY, JSON.stringify(list)); } catch (e) {}
}
function populateSubjectSelects(selectedValue) {
  const subjects = loadSubjects();
  const optionsHtml = subjects.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("")
    + `<option value="">General (no subject)</option>`
    + `<option value="${NEW_SUBJECT_VALUE}">+ Add new subject...</option>`;
  ["taskSubject", "bulkSubject"].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const prevValue = selectedValue !== undefined ? selectedValue : el.value;
    el.innerHTML = optionsHtml;
    if (prevValue && subjects.includes(prevValue)) el.value = prevValue;
  });
}
function handleSubjectSelectChange(selectEl) {
  if (selectEl.value !== NEW_SUBJECT_VALUE) return;
  const name = (window.prompt("New subject name:") || "").trim();
  if (!name) { selectEl.value = ""; return; }
  const subjects = loadSubjects();
  if (!subjects.includes(name)) {
    subjects.push(name);
    saveSubjects(subjects);
  }
  populateSubjectSelects(name);
}

function todayStr() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function getStartDate() {
  let s = localStorage.getItem(START_KEY);
  if (!s) { s = todayStr(); localStorage.setItem(START_KEY, s); }
  return s;
}
function dayNumber(dateStr) {
  const start = getStartDate();
  const a = new Date(start + "T00:00:00");
  const b = new Date(dateStr + "T00:00:00");
  const diff = Math.round((b - a) / 86400000);
  return Math.max(1, diff + 1);
}
function dayBadge(dateStr) {
  return `Day-${String(dayNumber(dateStr)).padStart(2, "0")}`;
}
function prettyDate(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}
function loadCollapsed() {
  try { collapsed = JSON.parse(localStorage.getItem(COLLAPSE_KEY) || "{}"); } catch (e) { collapsed = {}; }
}
function saveCollapsed() {
  try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsed)); } catch (e) {}
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    tasks = raw ? JSON.parse(raw) : [];
  } catch (e) { tasks = []; }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (e) {}
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(s) {
  const d = document.createElement("div"); d.textContent = s; return d.innerHTML;
}

function render() {
  const container = document.getElementById("dayGroups");
  const priorityRank = { high: 0, medium: 1, low: 2 };

  const active = tasks.filter(t => !t.completed).length;
  document.getElementById("stats").textContent = `${active} active · ${tasks.length - active} done`;
  const totalPoints = tasks.filter(t => t.completed).reduce((sum, t) => sum + (t.points || 0), 0);
  document.getElementById("pointsBadge").textContent = `⚡ ${totalPoints} pts`;

  const { current, next } = getRankInfo(totalPoints);
  document.querySelector("#rankBadge .rank-icon").textContent = current.icon;
  document.getElementById("rankName").textContent = current.name;
  if (next) {
    const span = next.min - current.min;
    const progressed = totalPoints - current.min;
    const pct = Math.max(0, Math.min(100, (progressed / span) * 100));
    document.getElementById("rankFill").style.width = pct + "%";
    document.getElementById("rankLabel").textContent = `${totalPoints} / ${next.min} pts to ${next.name}`;
  } else {
    document.getElementById("rankFill").style.width = "100%";
    document.getElementById("rankLabel").textContent = `${totalPoints} pts · Max rank reached`;
  }
  if (lastKnownRank === null) lastKnownRank = current.name;

  const groups = {};
  tasks.forEach(t => { (groups[t.date] = groups[t.date] || []).push(t); });
  const dates = Object.keys(groups).sort((a,b) => b.localeCompare(a));

  container.innerHTML = "";
  if (dates.length === 0) {
    container.innerHTML = `<div class="empty-state">Your list is empty. Add your first task.</div>`;
    return;
  }

  let anyVisible = false;
  dates.forEach(date => {
    const groupTasks = groups[date].filter(t =>
      filter === "Active" ? !t.completed : filter === "Done" ? t.completed : true
    );
    if (groupTasks.length === 0) return;
    anyVisible = true;

    const allTasks = groups[date];
    const doneCount = allTasks.filter(t => t.completed).length;
    const isComplete = doneCount === allTasks.length && allTasks.length > 0;
    const isCollapsed = !!collapsed[date];

    groupTasks.sort((a,b) => {
      if (a.completed !== b.completed) return a.completed ? 1 : -1;
      if (priorityRank[a.priority] !== priorityRank[b.priority]) return priorityRank[a.priority]-priorityRank[b.priority];
      return b.createdAt - a.createdAt;
    });

    const groupEl = document.createElement("div");
    groupEl.className = "day-group" + (isCollapsed ? " collapsed" : "");
    groupEl.innerHTML = `
      <div class="day-head ${isComplete ? 'complete' : ''}" data-date="${date}">
        <span class="day-badge-lg">${dayBadge(date)}</span>
        <div class="day-info">
          <span class="day-progress">${doneCount}/${allTasks.length} done${isComplete ? ' · Complete' : ''}</span>
          <span class="day-date">${prettyDate(date)}</span>
        </div>
        ${isComplete ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f9d69" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>' : ''}
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
      <div class="task-list"></div>
    `;
    const list = groupEl.querySelector(".task-list");

    const bySubject = {};
    groupTasks.forEach(t => {
      const s = t.subject || "";
      (bySubject[s] = bySubject[s] || []).push(t);
    });
    const subjectNames = Object.keys(bySubject).sort((a, b) => {
      if (a === "" ) return 1;
      if (b === "") return -1;
      return a.localeCompare(b);
    });

    subjectNames.forEach(subjectName => {
      if (subjectName) {
        const labelEl = document.createElement("div");
        labelEl.className = "subject-label";
        labelEl.textContent = subjectName;
        list.appendChild(labelEl);
      }
      bySubject[subjectName].forEach(t => {
        const row = document.createElement("div");
        row.className = "task-row" + (t.completed ? " completed" : "");
        row.style.borderLeft = `3px solid ${PRIORITY[t.priority].color}`;
        row.innerHTML = `
          <button class="check-btn" data-id="${t.id}" data-action="toggle">
            ${t.completed
              ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f9d69" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>'
              : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4a4d59" stroke-width="2"><circle cx="12" cy="12" r="9"></circle></svg>'}
          </button>
          <div class="task-body">
            <span class="task-text ${t.completed ? 'done' : ''}">${escapeHtml(t.text)}</span>
            <div class="task-meta"><span class="points-pill">${PRIORITY[t.priority].points} pts</span></div>
          </div>
          <button class="del-btn" data-id="${t.id}" data-action="delete">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8b8f9c" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
          </button>
        `;
        list.appendChild(row);
      });
    });
    container.appendChild(groupEl);
  });

  if (!anyVisible) {
    const msg = filter === "Done" ? "Nothing completed yet." : "No active tasks.";
    container.innerHTML = `<div class="empty-state">${msg}</div>`;
  }
}

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function playTone(freq, duration, delay = 0, type = "sine", vol = 0.16) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const start = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  gain.gain.setValueAtTime(vol, start);
  gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(start); osc.stop(start + duration);
}
function playCompleteSound() { playTone(700, 0.09, 0, "sine", 0.14); playTone(1000, 0.13, 0.07, "sine", 0.12); }
function playUncheckSound() { playTone(420, 0.09, 0, "sine", 0.1); }
function playDeleteSound() { playTone(300, 0.1, 0, "triangle", 0.08); }
function playGiftSound() {
  [523, 659, 784, 1047].forEach((f, i) => playTone(f, 0.18, i * 0.09, "sine", 0.13));
}

const REWARDS = ["🏆 Champion Day!", "🔥 On Fire!", "🌟 Star Performer!", "💪 Crushed It!", "🎯 Perfect Day!", "🚀 Unstoppable!", "👑 Day Boss!"];
function spawnConfetti() {
  const colors = ["#5b8dee", "#d9a441", "#4f9d69", "#e2574c", "#f0c869"];
  for (let i = 0; i < 26; i++) {
    const el = document.createElement("div");
    el.className = "confetti-piece";
    el.style.left = Math.random() * 100 + "vw";
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDelay = (Math.random() * 0.35) + "s";
    el.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2200);
  }
}

function showPointPop(amount) {
  const pop = document.createElement("div");
  pop.className = "point-pop";
  pop.textContent = `+${amount} pts`;
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 900);
  const badge = document.getElementById("pointsBadge");
  badge.classList.remove("bump");
  void badge.offsetWidth;
  badge.classList.add("bump");
}
function showDayPop(date) {
  spawnConfetti();
  playGiftSound();
  const reward = REWARDS[Math.floor(Math.random() * REWARDS.length)];
  const pop = document.createElement("div");
  pop.className = "gift-pop";
  pop.innerHTML = `
    <div class="gift-icon">🎁</div>
    <div class="gift-title">${dayBadge(date)} Complete!</div>
    <div class="gift-reward">${reward}</div>
  `;
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 1800);
}

function playRankUpSound() {
  [440, 554, 659, 880, 1108].forEach((f, i) => playTone(f, 0.2, i * 0.08, "sine", 0.14));
}
function showRankUp(rank) {
  spawnConfetti();
  playRankUpSound();
  const pop = document.createElement("div");
  pop.className = "rankup-pop";
  pop.innerHTML = `
    <div class="rankup-icon">${rank.icon}</div>
    <div class="rankup-title">Rank Up!</div>
    <div class="rankup-name">${rank.name}</div>
  `;
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 2000);
}

function addTask() {
  const input = document.getElementById("taskInput");
  const dateInput = document.getElementById("taskDate");
  const subjectInput = document.getElementById("taskSubject");
  const text = input.value.trim();
  if (!text) return;
  const subjectVal = subjectInput && subjectInput.value !== NEW_SUBJECT_VALUE ? subjectInput.value : "";
  tasks.unshift({
    id: uid(),
    text,
    priority: currentPriority,
    points: PRIORITY[currentPriority].points,
    date: dateInput.value || todayStr(),
    subject: subjectVal,
    completed: false,
    createdAt: Date.now(),
  });
  save(); render();
  input.value = "";
  input.focus();
}

document.getElementById("addBtn").addEventListener("click", addTask);
document.getElementById("taskInput").addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });

document.getElementById("dayGroups").addEventListener("click", e => {
  const head = e.target.closest(".day-head");
  if (head) {
    const date = head.dataset.date;
    collapsed[date] = !collapsed[date];
    saveCollapsed();
    render();
    return;
  }
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const id = btn.dataset.id;
  if (btn.dataset.action === "toggle") {
    const task = tasks.find(t => t.id === id);
    const willComplete = task && !task.completed;
    tasks = tasks.map(t => t.id === id ? {...t, completed: !t.completed} : t);
    if (willComplete && task) {
      playCompleteSound();
      showPointPop(task.points || 0);
      const newTotal = tasks.filter(t => t.completed).reduce((sum, t) => sum + (t.points || 0), 0);
      const newRank = getRankInfo(newTotal).current;
      const rankChanged = lastKnownRank !== null && newRank.name !== lastKnownRank;
      lastKnownRank = newRank.name;
      const sameDay = tasks.filter(t => t.date === task.date);
      const nowAllDone = sameDay.length > 0 && sameDay.every(t => t.completed);
      if (rankChanged) {
        setTimeout(() => showRankUp(newRank), 250);
        if (nowAllDone) setTimeout(() => showDayPop(task.date), 1600);
      } else if (nowAllDone) {
        setTimeout(() => showDayPop(task.date), 250);
      }
    } else {
      playUncheckSound();
      const newTotal = tasks.filter(t => t.completed).reduce((sum, t) => sum + (t.points || 0), 0);
      lastKnownRank = getRankInfo(newTotal).current.name;
    }
  } else if (btn.dataset.action === "delete") {
    playDeleteSound();
    tasks = tasks.filter(t => t.id !== id);
  }
  save(); render();
});

    container.innerHTML = toolDetailShell("Password Generator", `
      <div class="tool-field"><label>Length: <span id="pwLenLabel">14</span></label>
        <input type="range" min="6" max="32" value="14" id="pwLen" style="width:100%" />
      </div>
      <div class="tool-checks">
        <label class="tool-check"><input type="checkbox" id="pwUpper" checked /> Uppercase</label>
        <label class="tool-check"><input type="checkbox" id="pwLower" checked /> Lowercase</label>
        <label class="tool-check"><input type="checkbox" id="pwNum" checked /> Numbers</label>
        <label class="tool-check"><input type="checkbox" id="pwSym" checked /> Symbols</label>
      </div>
      <button class="tool-btn-primary" id="pwGenBtn">Generate Password</button>
      <div class="tool-result" id="pwResult" style="display:none"></div>
    `);
    document.getElementById("pwLen").addEventListener("input", (e) => {
      document.getElementById("pwLenLabel").textContent = e.target.value;
    });
    document.getElementById("pwGenBtn").addEventListener("click", () => {
      const len = parseInt(document.getElementById("pwLen").value);
      const useUpper = document.getElementById("pwUpper").checked;
      const useLower = document.getElementById("pwLower").checked;
      const useNum = document.getElementById("pwNum").checked;
      const useSym = document.getElementById("pwSym").checked;
      let chars = "";
      if (useUpper) chars += "ABCDEFGHJKLMNPQRSTUVWXYZ";
      if (useLower) chars += "abcdefghijkmnpqrstuvwxyz";
      if (useNum) chars += "23456789";
      if (useSym) chars += "!@#$%^&*()_+-=";
      const resultBox = document.getElementById("pwResult");
      if (!chars) {
        resultBox.style.display = "flex";
        resultBox.innerHTML = `<div class="tool-note">Select at least one character type.</div>`;
        return;
      }
      let pw = "";
      const arr = new Uint32Array(len);
      (window.crypto || window.msCrypto).getRandomValues(arr);
      for (let i = 0; i < len; i++) pw += chars[arr[i] % chars.length];
      resultBox.style.display = "flex";
      resultBox.innerHTML = `
        <div class="tool-result-big"><div class="val" style="font-size:18px;word-break:break-all;font-family:'IBM Plex Mono',monospace">${escapeHtml(pw)}</div></div>
        <button class="tool-btn-primary" id="pwCopyBtn">Copy Password</button>
      `;
      document.getElementById("pwCopyBtn").addEventListener("click", () => {
        navigator.clipboard.writeText(pw).then(() => {
          document.getElementById("pwCopyBtn").textContent = "Copied!";
          setTimeout(() => { document.getElementById("pwCopyBtn").textContent = "Copy Password"; }, 1200);
        }).catch(() => {
          document.getElementById("pwCopyBtn").textContent = "Copy failed";
        });
      });
    });
  },

  translate(container) {
    const LANGS = [
      ["en", "English"], ["hi", "Hindi"], ["mr", "Marathi"], ["gu", "Gujarati"], ["ta", "Tamil"],
      ["te", "Telugu"], ["kn", "Kannada"], ["ml", "Malayalam"], ["bn", "Bengali"], ["pa", "Punjabi"],
      ["ur", "Urdu"], ["es", "Spanish"], ["fr", "French"], ["de", "German"], ["zh-CN", "Chinese"],
      ["ja", "Japanese"], ["ar", "Arabic"], ["pt", "Portuguese"], ["ru", "Russian"],
    ];
    const langOptions = (sel) => LANGS.map(([c, n]) => `<option value="${c}"${c === sel ? " selected" : ""}>${n}</option>`).join("");
    container.innerHTML = toolDetailShell("Translate", `
      <div class="tool-row">
        <div class="tool-field"><label>From</label><select class="tool-select" id="trFrom">${langOptions("en")}</select></div>
        <div class="tool-field"><label>To</label><select class="tool-select" id="trTo">${langOptions("hi")}</select></div>
      </div>
      <div class="tool-field">
        <label>Text</label>
        <textarea class="tool-input" id="trText" rows="4" placeholder="Type text to translate..." style="resize:vertical;font-family:'Inter',sans-serif"></textarea>
      </div>
      <button class="tool-btn-primary" id="trBtn">Translate</button>
      <div class="tool-result" id="trResult" style="display:none"></div>
      <div class="tool-note">Needs internet connection · free daily limit applies</div>
    `);
    document.getElementById("trBtn").addEventListener("click", async () => {
      const text = document.getElementById("trText").value.trim();
      const from = document.getElementById("trFrom").value;
      const to = document.getElementById("trTo").value;
      if (!text) return;
      const btn = document.getElementById("trBtn");
      btn.textContent = "Translating...";
      try {
        const params = new URLSearchParams({ q: text.slice(0, 480), langpair: `${from}|${to}` });
        const res = await fetch(`https://api.mymemory.translated.net/get?${params}`);
        const data = await res.json();
        const translated = data && data.responseData ? data.responseData.translatedText : null;
        document.getElementById("trResult").style.display = "flex";
        if (translated) {
          document.getElementById("trResult").innerHTML = `
            <div class="tool-result-big"><div class="val" style="font-size:17px;font-family:'Inter',sans-serif">${escapeHtml(translated)}</div></div>
            <button class="tool-btn-primary" id="trCopyBtn">Copy Translation</button>
          `;
          document.getElementById("trCopyBtn").addEventListener("click", () => {
            navigator.clipboard.writeText(translated).then(() => {
              document.getElementById("trCopyBtn").textContent = "Copied!";
              setTimeout(() => { document.getElementById("trCopyBtn").textContent = "Copy Translation"; }, 1200);
            });
          });
        } else {
          document.getElementById("trResult").innerHTML = `<div class="tool-note">Couldn't translate. Try again or check your connection.</div>`;
        }
      } catch (err) {
        document.getElementById("trResult").style.display = "flex";
        document.getElementById("trResult").innerHTML = `<div class="tool-note">Error: ${err.message}</div>`;
      }
      btn.textContent = "Translate";
    });
  },

  calculator(container) {
    container.innerHTML = toolDetailShell("Calculator", `
      <div class="calc-display">
        <div class="calc-expr" id="calcExpr"></div>
        <div id="calcMain">0</div>
      </div>
      <div class="calc-grid">
        <button class="calc-btn clear" data-k="C">C</button>
        <button class="calc-btn clear" data-k="back">⌫</button>
        <button class="calc-btn op" data-k="%">%</button>
        <button class="calc-btn op" data-k="/">÷</button>
        <button class="calc-btn" data-k="7">7</button>
        <button class="calc-btn" data-k="8">8</button>
        <button class="calc-btn" data-k="9">9</button>
        <button class="calc-btn op" data-k="*">×</button>
        <button class="calc-btn" data-k="4">4</button>
        <button class="calc-btn" data-k="5">5</button>
        <button class="calc-btn" data-k="6">6</button>
        <button class="calc-btn op" data-k="-">−</button>
        <button class="calc-btn" data-k="1">1</button>
        <button class="calc-btn" data-k="2">2</button>
        <button class="calc-btn" data-k="3">3</button>
        <button class="calc-btn op" data-k="+">+</button>
        <button class="calc-btn" data-k="0" style="grid-column: span 2">0</button>
        <button class="calc-btn" data-k=".">.</button>
        <button class="calc-btn eq" data-k="=">=</button>
      </div>
    `);
    let expr = "";
    const mainEl = document.getElementById("calcMain");
    const exprEl = document.getElementById("calcExpr");
    function updateDisplay() {
      mainEl.textContent = expr === "" ? "0" : expr;
    }
    function calcResult() {
      const clean = expr.replace(/[^0-9+\-*/.%()]/g, "");
      if (!clean) return;
      try {
        const result = Function(`"use strict"; return (${clean})`)();
        if (result === undefined || isNaN(result) || !isFinite(result)) throw new Error("bad");
        exprEl.textContent = expr + " =";
        expr = String(Math.round(result * 1e10) / 1e10);
        updateDisplay();
      } catch (e) {
        mainEl.textContent = "Error";
        expr = "";
      }
    }
    container.querySelectorAll(".calc-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const k = btn.dataset.k;
        if (k === "C") { expr = ""; exprEl.textContent = ""; updateDisplay(); }
        else if (k === "back") { expr = expr.slice(0, -1); updateDisplay(); }
        else if (k === "=") { calcResult(); }
        else { expr += k; updateDisplay(); }
      });
    });
  },

  expenses(container) {
    const EXP_KEY = "todo-app-expenses";
    const CATS = ["Food", "Transport", "Shopping", "Bills", "Entertainment", "Health", "Other"];
    function loadExp() {
      try { return JSON.parse(localStorage.getItem(EXP_KEY) || "[]"); } catch (e) { return []; }
    }
    function saveExp(list) {
      try { localStorage.setItem(EXP_KEY, JSON.stringify(list)); } catch (e) {}
    }
    container.innerHTML = toolDetailShell("Expense Tracker", `
      <div class="exp-summary">
        <div class="exp-summary-card"><div class="exp-val" id="expToday">₹0</div><div class="exp-lbl">Today</div></div>
        <div class="exp-summary-card"><div class="exp-val" id="expMonth">₹0</div><div class="exp-lbl">This Month</div></div>
      </div>
      <div class="tool-row">
        <div class="tool-field"><label>Amount (₹)</label><input type="number" class="tool-input" id="expAmt" placeholder="150" /></div>
        <div class="tool-field"><label>Category</label>
          <select class="tool-select" id="expCat">${CATS.map(c => `<option>${c}</option>`).join("")}</select>
        </div>
      </div>
      <div class="tool-field"><label>Note (optional)</label><input type="text" class="tool-input" id="expNote" placeholder="e.g. Lunch with friends" /></div>
      <div class="tool-field"><label>Date</label><input type="date" class="tool-input" id="expDate" /></div>
      <button class="tool-btn-primary" id="expAddBtn">Add Expense</button>
      <div class="exp-list" id="expList"></div>
    `);
    document.getElementById("expDate").value = todayStr();

    function render() {
      const list = loadExp();
      const today = todayStr();
      const monthPrefix = today.slice(0, 7);
      const todayTotal = list.filter(e => e.date === today).reduce((s, e) => s + e.amount, 0);
      const monthTotal = list.filter(e => e.date && e.date.startsWith(monthPrefix)).reduce((s, e) => s + e.amount, 0);
      document.getElementById("expToday").textContent = `₹${fmtNum(todayTotal)}`;
      document.getElementById("expMonth").textContent = `₹${fmtNum(monthTotal)}`;

      const groups = {};
      list.forEach(e => { (groups[e.date] = groups[e.date] || []).push(e); });
      const dates = Object.keys(groups).sort((a, b) => b.localeCompare(a));
      const listEl = document.getElementById("expList");
      if (dates.length === 0) {
        listEl.innerHTML = `<div class="empty-state">No expenses logged yet.</div>`;
        return;
      }
      listEl.innerHTML = dates.map(date => {
        const items = groups[date].sort((a, b) => b.createdAt - a.createdAt);
        const dayTotal = items.reduce((s, e) => s + e.amount, 0);
        return `
          <div class="exp-day-label">${prettyDate(date)} · ₹${fmtNum(dayTotal)}</div>
          ${items.map(e => `
            <div class="exp-item">
              <div>
                <div class="exp-cat">${escapeHtml(e.category)}</div>
                ${e.note ? `<div class="exp-note">${escapeHtml(e.note)}</div>` : ""}
              </div>
              <span class="exp-amt">−₹${fmtNum(e.amount)}</span>
              <button class="exp-del" data-id="${e.id}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>
              </button>
            </div>
          `).join("")}
        `;
      }).join("");
      listEl.querySelectorAll(".exp-del").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.id;
          saveExp(loadExp().filter(e => e.id !== id));
          render();
        });
      });
    }

    document.getElementById("expAddBtn").addEventListener("click", () => {
      const amt = parseFloat(document.getElementById("expAmt").value);
      const cat = document.getElementById("expCat").value;
      const note = document.getElementById("expNote").value.trim();
      const date = document.getElementById("expDate").value || todayStr();
      if (!amt || amt <= 0) return;
      const list = loadExp();
      list.push({ id: uid(), amount: amt, category: cat, note, date, createdAt: Date.now() });
      saveExp(list);
      document.getElementById("expAmt").value = "";
      document.getElementById("expNote").value = "";
      render();
    });

    render();
  },

  wellbeing(container) {
    const WB_KEY = "todo-app-wellbeing";
    function loadWb() {
      try { return JSON.parse(localStorage.getItem(WB_KEY) || '{"goalHours":4,"logs":{}}'); }
      catch (e) { return { goalHours: 4, logs: {} }; }
    }
    function saveWb(data) {
      try { localStorage.setItem(WB_KEY, JSON.stringify(data)); } catch (e) {}
    }
    let wb = loadWb();

    container.innerHTML = toolDetailShell("Digital Wellbeing", `
      <div class="tool-field"><label>Daily screen time goal (hours)</label><input type="number" step="0.5" class="tool-input" id="wbGoal" placeholder="4" /></div>
      <button class="tool-btn-primary" id="wbSaveGoalBtn">Save Goal</button>

      <div class="divider"></div>

      <div class="tool-field"><label>Log today's screen time (hours)</label><input type="number" step="0.1" class="tool-input" id="wbToday" placeholder="3.5" /></div>
      <button class="tool-btn-primary" id="wbLogBtn">Save Today's Log</button>
      <div class="tool-result" id="wbProgress" style="display:none"></div>

      <div class="tool-field"><label>Last 7 days</label></div>
      <div id="wbHistory"></div>

      <div class="divider"></div>

      <div class="tool-field"><label>Focus Timer</label></div>
      <div class="tool-result">
        <div class="wb-timer-display" id="wbTimerDisplay">25:00</div>
        <div class="tool-row">
          <button class="tool-btn-primary" id="wbTimerStart" style="flex:1">Start</button>
          <button class="tool-btn-primary" id="wbTimerReset" style="flex:1;background:var(--panel);color:var(--text);border:1px solid var(--border-strong)">Reset</button>
        </div>
        <div class="tool-note">25-minute focus session · a sound plays when it ends</div>
      </div>
    `);

    function renderProgressAndHistory() {
      wb = loadWb();
      document.getElementById("wbGoal").value = wb.goalHours;
      const today = todayStr();
      const todayLog = wb.logs[today];
      const progBox = document.getElementById("wbProgress");
      if (todayLog !== undefined) {
        const pct = Math.min(100, (todayLog / wb.goalHours) * 100);
        const over = todayLog > wb.goalHours;
        progBox.style.display = "flex";
        progBox.innerHTML = `
          <div class="tool-result-row"><span class="tool-result-label">Today</span><span class="tool-result-value" style="color:${over ? '#e2574c' : '#4f9d69'}">${todayLog}h / ${wb.goalHours}h</span></div>
          <div class="wb-progress-track"><div class="wb-progress-fill" style="width:${pct}%;background:${over ? '#e2574c' : '#4f9d69'}"></div></div>
          ${over ? '<div class="tool-note">Over your goal today — maybe take a break 🌿</div>' : '<div class="tool-note">Nice, within your goal today 👍</div>'}
        `;
      } else {
        progBox.style.display = "none";
      }

      const histEl = document.getElementById("wbHistory");
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const pad = n => String(n).padStart(2, "0");
        const key = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
        days.push({ key, label: d.toLocaleDateString("en-GB", { weekday: "short" }).slice(0,3), hours: wb.logs[key] });
      }
      const maxH = Math.max(wb.goalHours, ...days.map(d => d.hours || 0), 1);
      histEl.innerHTML = days.map(d => {
        const h = d.hours || 0;
        const pct = (h / maxH) * 100;
        const over = h > wb.goalHours;
        return `
          <div class="wb-history-row">
            <span class="wb-history-day">${d.label}</span>
            <div class="wb-history-track"><div class="wb-history-fill" style="width:${pct}%;background:${d.hours === undefined ? 'var(--border-strong)' : (over ? '#e2574c' : '#4f9d69')}"></div></div>
            <span class="wb-history-val">${d.hours !== undefined ? d.hours + "h" : "—"}</span>
          </div>
        `;
      }).join("");
    }

    document.getElementById("wbSaveGoalBtn").addEventListener("click", () => {
      const goal = parseFloat(document.getElementById("wbGoal").value);
      if (!goal || goal <= 0) return;
      wb = loadWb();
      wb.goalHours = goal;
      saveWb(wb);
      renderProgressAndHistory();
    });
    document.getElementById("wbLogBtn").addEventListener("click", () => {
      const hours = parseFloat(document.getElementById("wbToday").value);
      if (isNaN(hours) || hours < 0) return;
      wb = loadWb();
      wb.logs[todayStr()] = hours;
      saveWb(wb);
      document.getElementById("wbToday").value = "";
      renderProgressAndHistory();
    });

    // Focus timer
    let timerSeconds = 25 * 60;
    let timerInterval = null;
    let timerRunning = false;
    function formatTimer(s) {
      const m = Math.floor(s / 60), sec = s % 60;
      return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
    }
    function updateTimerDisplay() {
      document.getElementById("wbTimerDisplay").textContent = formatTimer(timerSeconds);
    }
    document.getElementById("wbTimerStart").addEventListener("click", (e) => {
      if (timerRunning) {
        clearInterval(timerInterval);
        timerRunning = false;
        e.target.textContent = "Resume";
        return;
      }
      timerRunning = true;
      e.target.textContent = "Pause";
      timerInterval = setInterval(() => {
        timerSeconds--;
        updateTimerDisplay();
        if (timerSeconds <= 0) {
          clearInterval(timerInterval);
          timerRunning = false;
          document.getElementById("wbTimerStart").textContent = "Start";
          playGiftSound();
          timerSeconds = 25 * 60;
          updateTimerDisplay();
        }
      }, 1000);
    });
    document.getElementById("wbTimerReset").addEventListener("click", () => {
      clearInterval(timerInterval);
      timerRunning = false;
      timerSeconds = 25 * 60;
      document.getElementById("wbTimerStart").textContent = "Start";
      updateTimerDisplay();
    });

    renderProgressAndHistory();
  },

  leaderboard(container) {
    const LB_KEY = "todoapp-lb-x9k2m7q4-v1";
    const NAME_KEY = "todo-app-username";
    const DEVICE_KEY = "todo-app-device-id";
    function getDeviceId() {
      let id = localStorage.getItem(DEVICE_KEY);
      if (!id) { id = Math.random().toString(36).slice(2, 8); localStorage.setItem(DEVICE_KEY, id); }
      return id;
    }
    function getTotalPoints() {
      return tasks.filter(t => t.completed).reduce((sum, t) => sum + (t.points || 0), 0);
    }
    function parseEntries(str) {
      if (!str || typeof str !== "string") return {};
      const out = {};
      str.split(";").forEach(chunk => {
        const parts = chunk.split(",");
        if (parts.length !== 3) return;
        const [id, name, pts] = parts;
        if (!/^[a-z0-9]{4,10}$/i.test(id)) return;
        if (!name || !/^\d+$/.test(pts)) return;
        out[id] = { name, points: parseInt(pts) };
      });
      return out;
    }
    function serializeEntries(entries) {
      const sorted = Object.entries(entries).sort((a, b) => b[1].points - a[1].points).slice(0, 10);
      return sorted.map(([id, e]) => `${id},${e.name},${e.points}`).join(";");
    }

    const savedName = localStorage.getItem(NAME_KEY) || "";
    container.innerHTML = toolDetailShell("Leaderboard", `
      <div class="tool-field">
        <label>Your name (shown to everyone on the leaderboard)</label>
        <input type="text" class="tool-input" id="lbName" maxlength="14" placeholder="e.g. Rahul" value="${escapeHtml(savedName)}" />
      </div>
      <button class="tool-btn-primary" id="lbSyncBtn">Save Name & Sync My Score</button>
      <div class="tool-note" id="lbStatus"></div>
      <div class="divider"></div>
      <div id="lbList"></div>
      <button class="tool-btn-primary" id="lbRefreshBtn" style="background:var(--panel);color:var(--text);border:1px solid var(--border-strong)">Refresh Leaderboard</button>
      <div class="tool-note">Shared with everyone using this app · needs internet · names/points only, no other data</div>
    `);

    function renderList(entries) {
      const deviceId = getDeviceId();
      const sorted = Object.entries(entries).sort((a, b) => b[1].points - a[1].points);
      const listEl = document.getElementById("lbList");
      if (sorted.length === 0) {
        listEl.innerHTML = `<div class="empty-state">No one has synced yet. Be the first!</div>`;
        return;
      }
      listEl.innerHTML = sorted.map(([id, e], i) => {
        const rank = getRankInfo(e.points).current;
        const isYou = id === deviceId;
        return `
          <div class="lb-item ${isYou ? "you" : ""}">
            <span class="lb-rank-num">${i + 1}</span>
            <div class="lb-info">
              <div class="lb-name">${escapeHtml(e.name)}${isYou ? '<span class="you-tag">YOU</span>' : ""}</div>
              <div class="lb-rank-label">${rank.icon} ${rank.name}</div>
            </div>
            <span class="lb-points">${e.points}</span>
          </div>
        `;
      }).join("");
    }

    function fetchWithTimeout(url, ms = 8000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), ms);
      return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
    }

    async function fetchLeaderboard() {
      const status = document.getElementById("lbStatus");
      status.textContent = "Loading...";
      try {
        const res = await fetchWithTimeout(`https://api.keyval.org/get/${LB_KEY}`);
        const text = await res.text();
        let raw = text;
        try {
          const parsed = JSON.parse(text);
          if (parsed && typeof parsed === "object" && typeof parsed.value === "string") raw = parsed.value;
          else if (typeof parsed === "string") raw = parsed;
        } catch (e) { /* plain text response, use as-is */ }
        const entries = parseEntries(raw);
        renderList(entries);
        status.textContent = "";
        return entries;
      } catch (err) {
        status.textContent = "Couldn't load leaderboard. Check your internet connection.";
        return {};
      }
    }

    document.getElementById("lbSyncBtn").addEventListener("click", async () => {
      const name = document.getElementById("lbName").value.trim().replace(/[,;]/g, "").slice(0, 14);
      const status = document.getElementById("lbStatus");
      if (!name) { status.textContent = "Enter a name first."; return; }
      localStorage.setItem(NAME_KEY, name);
      status.textContent = "Syncing...";
      try {
        const entries = await fetchLeaderboard();
        entries[getDeviceId()] = { name, points: getTotalPoints() };
        const serialized = serializeEntries(entries);
        await fetchWithTimeout(`https://api.keyval.org/set/${LB_KEY}/${encodeURIComponent(serialized)}`);
        const finalEntries = parseEntries(serialized);
        renderList(finalEntries);
        status.textContent = "Synced!";
        setTimeout(() => { status.textContent = ""; }, 1500);
      } catch (err) {
        status.textContent = "Sync failed. Check your internet connection.";
      }
    });

    document.getElementById("lbRefreshBtn").addEventListener("click", fetchLeaderboard);

    fetchLeaderboard();
  },
};

</script>
